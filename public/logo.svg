<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <!-- Orange background square with rounded corners -->
  <rect width="48" height="48" rx="10" fill="#F97316"/>
  <!-- Roof triangle (pointed, characteristic of African case) -->
  <polygon points="24,7 42,24 6,24" fill="white"/>
  <!-- Chimney / roof peak dot -->
  <circle cx="24" cy="7" r="2.5" fill="#F97316"/>
  <!-- House body -->
  <rect x="10" y="24" width="28" height="17" rx="1" fill="white"/>
  <!-- Door (orange cutout in center) -->
  <rect x="20" y="31" width="8" height="10" rx="1.5" fill="#F97316"/>
  <!-- Left window -->
  <rect x="12" y="27" width="5" height="5" rx="1" fill="#F97316"/>
  <!-- Right window -->
  <rect x="31" y="27" width="5" height="5" rx="1" fill="#F97316"/>
</svg>
